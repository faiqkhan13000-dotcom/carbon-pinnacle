<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Rich Emerald -->
    <linearGradient id="cpBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="cpShine" x1="256" y1="32" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Stroke Gradient -->
    <linearGradient id="cpStroke" x1="120" y1="100" x2="392" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <!-- Soft Drop Shadow for Pinnacle Layers -->
    <filter id="cpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#cpBg)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#cpShine)" />
  <rect x="32" y="32" width="448" height="448" rx="104" stroke="#a7f3d0" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- 3-Tier Carbon Pinnacle Emblem -->
  <g filter="url(#cpShadow)" stroke="url(#cpStroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Pinnacle Peak (Diamond) -->
    <polygon
      points="256,104 396,174 256,244 116,174"
      fill="#ffffff"
      fill-opacity="0.2"
      stroke-width="26"
    />

    <!-- Middle Tier Chevron -->
    <polyline
      points="116,244 256,314 396,244"
      fill="none"
      stroke-width="26"
    />

    <!-- Bottom Tier Chevron -->
    <polyline
      points="116,314 256,384 396,314"
      fill="none"
      stroke-width="26"
    />
  </g>
</svg>
